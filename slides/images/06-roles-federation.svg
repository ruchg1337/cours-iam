<svg xmlns="http://www.w3.org/2000/svg" viewBox="128 181 1024 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#17252e">
<title>Les trois rôles de toute fédération : l'utilisateur s'authentifie auprès du fournisseur d'identité (IdP), qui transmet la preuve signée au fournisseur de service (SP) via le navigateur ; l'IdP et le SP ont une relation de confiance établie une fois.</title>
<rect x="156" y="245" width="224" height="102" rx="10" fill="#c8651b"/>
<text text-anchor="middle" font-size="18.7" font-weight="700" fill="#fff"><tspan x="268" y="283.0">L'utilisateur</tspan></text>
<text text-anchor="middle" font-size="14.2" font-style="italic" fill="#fff"><tspan x="268" y="320.0">Marie, derrière son navigateur</tspan></text>
<text text-anchor="start" font-size="16.9"><tspan x="144" y="390.0">La personne qui veut accéder à</tspan><tspan x="144" y="410.5">l'application. Elle ne s'authentifie</tspan><tspan x="144" y="431.0">qu'à un seul endroit : l'IdP.</tspan></text>
<text x="144" y="457.5" font-size="14.2" fill="#5c6b73">SAML : principal · OIDC : end user</text>
<rect x="528" y="245" width="224" height="102" rx="10" fill="#0f5964"/>
<text text-anchor="middle" font-size="17.8" font-weight="700" fill="#fff"><tspan x="640" y="274.0">Le fournisseur</tspan><tspan x="640" y="295.0">d'identité (IdP)</tspan></text>
<text text-anchor="middle" font-size="14.2" font-style="italic" fill="#fff"><tspan x="640" y="312.0">Entra ID, Okta, Keycloak,</tspan><tspan x="640" y="329.0">SWITCH edu-ID</tspan></text>
<text text-anchor="start" font-size="16.9"><tspan x="515" y="390.0">Il authentifie l'utilisateur et émet</tspan><tspan x="515" y="410.5">une preuve signée (assertion</tspan><tspan x="515" y="431.0">SAML, jeton OIDC). Il devient</tspan><tspan x="515" y="451.5">l'élément le plus critique du</tspan><tspan x="515" y="472.0">système d'information.</tspan></text>
<text x="515" y="498.5" font-size="14.2" fill="#5c6b73">SAML : IdP · OIDC : OpenID Provider</text>
<rect x="899" y="245" width="224" height="102" rx="10" fill="#5c6b73"/>
<text text-anchor="middle" font-size="17.8" font-weight="700" fill="#fff"><tspan x="1011" y="274.0">Le fournisseur de</tspan><tspan x="1011" y="295.0">service (SP)</tspan></text>
<text text-anchor="middle" font-size="14.2" font-style="italic" fill="#fff"><tspan x="1011" y="312.0">L'application : SaaS, portail,</tspan><tspan x="1011" y="329.0">logiciel métier</tspan></text>
<text text-anchor="start" font-size="16.9"><tspan x="886" y="390.0">Il reçoit la preuve, vérifie la</tspan><tspan x="886" y="410.5">signature, l'émetteur, le</tspan><tspan x="886" y="431.0">destinataire et la validité, puis</tspan><tspan x="886" y="451.5">ouvre une session et applique</tspan><tspan x="886" y="472.0">ses propres règles</tspan><tspan x="886" y="492.5">d'autorisation.</tspan></text>
<text x="886" y="519.0" font-size="14.2" fill="#5c6b73">SAML : SP · OIDC : Relying Party</text>
<polygon points="393.0,290.8 502.5,290.8 502.5,285.0 514.0,296.5 502.5,308.0 502.5,302.2 393.0,302.2" fill="#0f5964"/>
<text x="453.5" y="276" text-anchor="middle" font-size="14.2" font-weight="700" fill="#0f5964">1. s'authentifie</text>
<text text-anchor="middle" font-size="12.4" font-style="italic" fill="#5c6b73"><tspan x="453.5" y="326.0">mot de passe ou</tspan><tspan x="453.5" y="341.0">passkey</tspan></text>
<polygon points="764.0,290.8 873.5,290.8 873.5,285.0 885.0,296.5 873.5,308.0 873.5,302.2 764.0,302.2" fill="#0f5964"/>
<text text-anchor="middle" font-size="14.2" font-weight="700" fill="#0f5964"><tspan x="824.5" y="260.0">2. transmet la</tspan><tspan x="824.5" y="277.0">preuve signée</tspan></text>
<text x="824.5" y="328" text-anchor="middle" font-size="13.3" font-style="italic" fill="#5c6b73">via le navigateur</text>
<path d="M639.5,245 V217.5 H1010.5 V245" fill="none" stroke="#0f5964" stroke-width="3"/>
<text x="825.5" y="203" text-anchor="middle" font-size="12.4" font-style="italic" fill="#0f5964">Relation de confiance, établie une fois : échange de métadonnées et de clés publiques</text>
</svg>
