<svg xmlns="http://www.w3.org/2000/svg" viewBox="128 181 1024 454" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#17252e">
<title>Les trois facteurs d'authentification : ce que je sais, ce que je possède, ce que je suis. Multifacteur veut dire deux catégories différentes.</title>
<rect x="128" y="181" width="324" height="336" rx="10" fill="#f0ece3"/>
<circle cx="290" cy="243" r="46" fill="#0f5964"/>
<text x="290" y="323" text-anchor="middle" font-size="23.1" font-weight="700">Ce que je sais</text>
<text text-anchor="middle" font-size="16" font-weight="700" fill="#0f5964"><tspan x="290" y="353.0">Mot de passe, code PIN, question de</tspan><tspan x="290" y="372.0">récupération</tspan></text>
<text text-anchor="middle" font-size="15.1"><tspan x="290" y="399.0">Se copie sans laisser de trace et se</tspan><tspan x="290" y="417.0">transmet par phishing. Le seul facteur</tspan><tspan x="290" y="435.0">qu'un utilisateur peut donner à un</tspan><tspan x="290" y="453.0">attaquant sans s'en rendre compte.</tspan></text>
<rect x="204" y="472" width="170" height="33" rx="16.5" fill="#c8651b"/><text x="289.0" y="493.9" text-anchor="middle" font-size="15.1" font-weight="700" fill="#fff">Se vole sans trace</text>
<rect x="477" y="181" width="324" height="336" rx="10" fill="#f0ece3"/>
<circle cx="639" cy="243" r="46" fill="#0f5964"/>
<text x="639" y="323" text-anchor="middle" font-size="23.1" font-weight="700">Ce que je possède</text>
<text text-anchor="middle" font-size="16" font-weight="700" fill="#0f5964"><tspan x="639" y="353.0">Téléphone, clé de sécurité, carte à</tspan><tspan x="639" y="372.0">puce, certificat</tspan></text>
<text text-anchor="middle" font-size="15.1"><tspan x="639" y="399.0">Exige d'avoir l'objet. Qualité très</tspan><tspan x="639" y="417.0">variable : un code reçu par SMS et une</tspan><tspan x="639" y="435.0">clé FIDO2 sont dans la même catégorie</tspan><tspan x="639" y="453.0">et ne protègent pas du tout pareil.</tspan></text>
<rect x="561" y="472" width="156" height="33" rx="16.5" fill="#5c6b73"/><text x="639.0" y="493.9" text-anchor="middle" font-size="15.1" font-weight="700" fill="#fff">Du SMS à FIDO2</text>
<rect x="827" y="181" width="324" height="336" rx="10" fill="#f0ece3"/>
<circle cx="989" cy="243" r="46" fill="#0f5964"/>
<text x="989" y="323" text-anchor="middle" font-size="23.1" font-weight="700">Ce que je suis</text>
<text text-anchor="middle" font-size="16.9" font-weight="700" fill="#0f5964"><tspan x="989" y="353.0">Empreinte, visage, iris, voix</tspan></text>
<text text-anchor="middle" font-size="15.1"><tspan x="989" y="399.0">Ne se change pas en cas de vol. En</tspan><tspan x="989" y="417.0">pratique, sert presque toujours à</tspan><tspan x="989" y="435.0">déverrouiller localement un objet (le</tspan><tspan x="989" y="453.0">téléphone), pas à s'authentifier à distance.</tspan></text>
<rect x="895" y="472" width="188" height="33" rx="16.5" fill="#0f5964"/><text x="989.0" y="493.9" text-anchor="middle" font-size="15.1" font-weight="700" fill="#fff">Déverrouille un objet</text>
<rect x="259" y="224" width="61" height="35" rx="7" fill="#fff"/>
<polygon points="269,257 284,257 276.5,269" fill="#fff"/>
<text x="289.5" y="247.5" text-anchor="middle" font-size="17.8" font-weight="700" fill="#0f5964">• • • •</text>
<rect x="623" y="212" width="33" height="61" rx="5" fill="#fff"/>
<rect x="628" y="220" width="23" height="38" fill="#0f5964"/>
<circle cx="639.5" cy="265.5" r="3.5" fill="#0f5964"/>
<circle cx="989.5" cy="224.5" r="12.5" fill="#fff"/>
<path d="M962,273 V257 A16,16 0 0 1 978,241 H999 A16,16 0 0 1 1015,257 V273 Z" fill="#fff"/>
<rect x="128" y="533" width="1024" height="102" rx="10" fill="#f8e6d7"/>
<text x="147" y="564" font-size="19.6" font-weight="700">Multifacteur veut dire deux catégories différentes, pas deux secrets.</text>
<rect x="147" y="587" width="129" height="33" rx="16.5" fill="#5c6b73"/><text x="211.5" y="608.9" text-anchor="middle" font-size="15.1" font-weight="700" fill="#fff">Mot de passe</text>
<text x="295.5" y="610.5" text-anchor="middle" font-size="19.6" font-weight="700" fill="#5c6b73">+</text>
<rect x="314" y="587" width="93" height="33" rx="16.5" fill="#0f5964"/><text x="360.5" y="608.9" text-anchor="middle" font-size="15.1" font-weight="700" fill="#fff">Passkey</text>
<text x="418" y="609.5" font-size="16.9" font-weight="700" fill="#0f5964">= MFA</text>
<rect x="569" y="587" width="129" height="33" rx="16.5" fill="#5c6b73"/><text x="633.5" y="608.9" text-anchor="middle" font-size="15.1" font-weight="700" fill="#fff">Mot de passe</text>
<text x="718.5" y="610.5" text-anchor="middle" font-size="19.6" font-weight="700" fill="#5c6b73">+</text>
<rect x="737" y="587" width="155" height="33" rx="16.5" fill="#5c6b73"/><text x="814.5" y="608.9" text-anchor="middle" font-size="15.1" font-weight="700" fill="#fff">Question secrète</text>
<text x="903" y="609.5" font-size="16.9" font-weight="700" fill="#c8651b">≠ MFA : deux fois « je sais »</text>
</svg>
