<title>Chaîne RBAC : utilisateur Marie Dupont, rôle gestionnaire de prestations, permission valider une rente inférieure à 50 000 CHF, ressource application de gestion des prestations</title>
<rect x="128" y="181" width="215" height="121" rx="10" fill="#e4efed"/>
