      contents:
        - exercices/index.qmd
        - exercices/politique-authentification.qmd
        - exercices/diagnostic-architecture.qmd
        - exercices/questions-de-revision.qmd
    - id: labo
      title: "Labo"
      style: floating
      contents:
        - labo/index.qmd
        - labo/1-client-oidc.qmd
        - labo/2-federation-github.qmd
        - labo/3-roles.qmd
        - labo/4-aller-plus-loin.qmd
        - labo/depannage.qmd
    - id: slides
      title: "Slides"
      style: floating
      contents:
        - slides.qmd
        - text: "Introduction"
          href: slides/00-introduction.qmd
        - text: "01 · Les bases"
