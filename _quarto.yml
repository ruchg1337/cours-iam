          href: slides/11-conclusion.qmd
  page-footer:
    left: "Grégory Ruch"
    right: "Édition {{< var edition >}}"

format:
  html:
    theme:
      light: [cosmo, styles/theme.scss]
      dark: [cosmo, styles/theme.scss, styles/theme-dark.scss]
    toc: true
    toc-title: "Sur cette page"
    number-sections: false
    link-external-newwindow: true
    smooth-scroll: true
    code-copy: true
    highlight-style: github
    fig-cap-location: bottom
