project:
  type: website
  output-dir: _site
  # Seuls les .qmd sont publiés : le kit du labo (labo/kit) et les README restent hors du site.
  render:
    - "**/*.qmd"

lang: fr

website:
  title: "Gestion des identités et des accès"
  description: "Cours IAM de Grégory Ruch : le cours, les exercices et le labo Keycloak."
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    title: "IAM"
    left:
      - text: "Cours"
        href: cours/index.qmd
      - text: "Exercices"
        href: exercices/index.qmd
      - text: "Labo"
        href: labo/index.qmd
      - text: "Slides"
        menu:
          - text: "Toutes les slides"
            href: slides.qmd
          - text: "---"
          - text: "Introduction"
            href: slides/00-introduction.qmd
          - text: "01 · Les bases"
            href: slides/01-bases.qmd
          - text: "02 · Où vivent les identités"
            href: slides/02-annuaires.qmd
          - text: "03 · Le cycle de vie de l'identité"
            href: slides/03-cycle-de-vie.qmd
          - text: "04 · L'autorisation"
            href: slides/04-autorisation.qmd
          - text: "05 · L'authentification"
            href: slides/05-authentification.qmd
          - text: "06 · SSO et fédération"
            href: slides/06-sso-federation.qmd
          - text: "07 · Les protocoles"
            href: slides/07-protocoles.qmd
          - text: "08 · Gouvernance et conformité"
            href: slides/08-gouvernance.qmd
          - text: "09 · Les frontières actuelles"
            href: slides/09-frontieres.qmd
          - text: "10 · Mener un projet IAM"
            href: slides/10-projet.qmd
          - text: "Conclusion"
            href: slides/11-conclusion.qmd
    right:
      - text: "Glossaire"
        href: glossaire.qmd
      - text: "Sources"
        href: sources.qmd
  sidebar:
    - id: cours
      title: "Cours"
      style: floating
      contents:
        - cours/index.qmd
        - cours/01-bases.qmd
        - cours/02-annuaires.qmd
        - cours/03-cycle-de-vie.qmd
        - cours/04-autorisation.qmd
        - cours/05-authentification.qmd
        - cours/06-sso-federation.qmd
        - cours/07-protocoles.qmd
        - cours/08-gouvernance.qmd
        - cours/09-frontieres.qmd
        - cours/10-projet.qmd
        - cours/a-retenir.qmd
    - id: exercices
      title: "Exercices"
