# Labo IAM : Keycloak + une application cliente OIDC
#
#   docker compose up --build
#
#   Keycloak        : http://localhost:8080   (console d'administration : admin / admin)
#   Application     : http://localhost:8000
#
# Pour charger le corrigé (realm "caisse" déjà configuré) :
#   docker compose -f docker-compose.yml -f solution/docker-compose.solution.yml up --build

services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - kc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev"]
    environment:
      # compte d'administration initial (à changer hors labo)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # base de données
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Adresse vue par le navigateur (c'est elle qui apparaît dans "iss" des jetons).
      KC_HOSTNAME: http://localhost:8080
      # L'application parle à Keycloak par le réseau interne (http://keycloak:8080) :
      # les URL de "backchannel" (token, jwks) sont alors résolues dynamiquement.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build: ./app
    environment:
      # Ce que le navigateur de l'utilisateur voit
      APP_BASE_URL: http://localhost:8000
      OIDC_ISSUER: http://localhost:8080/realms/caisse
      # Ce que le serveur de l'application utilise pour joindre Keycloak (réseau interne)
      OIDC_INTERNAL_BASE: http://keycloak:8080/realms/caisse
      # À remplir après avoir créé le client dans Keycloak (voir le guide, étape 3)
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-app-prestations}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-a-remplacer}
      FLASK_SECRET: ${FLASK_SECRET:-changez-moi-en-production}
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  kc-db:
