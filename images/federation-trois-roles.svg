<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#17252e">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8651b"/></marker>
  </defs>

  <!-- Relation de confiance -->
  <path d="M390 78 V48 H655 V78" fill="none" stroke="#0f5964" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="522" y="26" text-anchor="middle" fill="#0f5964" font-weight="700">Relation de confiance, établie une fois</text>
  <text x="522" y="42" text-anchor="middle" fill="#5c6b73" font-size="12">échange de métadonnées et de clés publiques</text>

  <!-- Utilisateur -->
  <rect x="10" y="80" width="200" height="120" rx="10" fill="#fbfaf6" stroke="#e4e0d6"/>
  <text x="110" y="112" text-anchor="middle" font-weight="700" font-size="15">L'utilisateur</text>
  <text x="110" y="136" text-anchor="middle" fill="#5c6b73">Marie, derrière</text>
  <text x="110" y="154" text-anchor="middle" fill="#5c6b73">son navigateur</text>
  <text x="110" y="184" text-anchor="middle" fill="#5c6b73" font-size="11.5">SAML : principal · OIDC : end user</text>

  <!-- IdP -->
  <rect x="290" y="80" width="200" height="120" rx="10" fill="#0f5964"/>
  <text x="390" y="112" text-anchor="middle" font-weight="700" font-size="15" fill="#fff">Fournisseur d'identité</text>
  <text x="390" y="136" text-anchor="middle" fill="#d6e9ea">Entra ID, Okta, Keycloak,</text>
  <text x="390" y="154" text-anchor="middle" fill="#d6e9ea">SWITCH edu-ID</text>
  <text x="390" y="184" text-anchor="middle" fill="#d6e9ea" font-size="11.5">SAML : IdP · OIDC : OpenID Provider</text>

  <!-- SP -->
  <rect x="570" y="80" width="200" height="120" rx="10" fill="#fbfaf6" stroke="#e4e0d6"/>
  <text x="670" y="112" text-anchor="middle" font-weight="700" font-size="15">Fournisseur de service</text>
  <text x="670" y="136" text-anchor="middle" fill="#5c6b73">L'application : SaaS,</text>
  <text x="670" y="154" text-anchor="middle" fill="#5c6b73">portail, logiciel métier</text>
  <text x="670" y="184" text-anchor="middle" fill="#5c6b73" font-size="11.5">SAML : SP · OIDC : Relying Party</text>

  <!-- Flèches -->
  <line x1="214" y1="140" x2="284" y2="140" stroke="#c8651b" stroke-width="2" marker-end="url(#f)"/>
  <line x1="494" y1="140" x2="564" y2="140" stroke="#c8651b" stroke-width="2" marker-end="url(#f)"/>
  <text x="250" y="226" text-anchor="middle" font-weight="700" fill="#c8651b">1. s'authentifie</text>
  <text x="250" y="243" text-anchor="middle" fill="#5c6b73" font-size="12">mot de passe ou passkey</text>
  <text x="530" y="226" text-anchor="middle" font-weight="700" fill="#c8651b">2. transmet la preuve signée</text>
  <text x="530" y="243" text-anchor="middle" fill="#5c6b73" font-size="12">via le navigateur</text>
</svg>
