<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#17252e">
  <style>text{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round} .n{stroke:none} .m{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace}</style>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17252e"/></marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker>
  </defs>
  <rect x="20.0" y="10" width="200" height="40" rx="8" fill="#0f5964"/>
  <text x="120" y="35" text-anchor="middle" font-weight="700" fill="#fff" class="n">Fournisseur d'identité</text>
  <rect x="320.0" y="10" width="160" height="40" rx="8" fill="#fbfaf6" stroke="#e4e0d6"/>
  <text x="400" y="35" text-anchor="middle" font-weight="700">Application</text>
  <rect x="620.0" y="10" width="120" height="40" rx="8" fill="#fbfaf6" stroke="#e4e0d6"/>
  <text x="680" y="35" text-anchor="middle" font-weight="700">API</text>
  <line x1="120" y1="50" x2="120" y2="350" stroke="#c9c4b8" stroke-dasharray="4 4"/>
  <line x1="400" y1="50" x2="400" y2="350" stroke="#c9c4b8" stroke-dasharray="4 4"/>
  <line x1="680" y1="50" x2="680" y2="350" stroke="#c9c4b8" stroke-dasharray="4 4"/>
  <line x1="120" y1="100" x2="394" y2="100" stroke="#17252e" stroke-width="1.6" marker-end="url(#f)"/>
  <rect x="190.0" y="75" width="140" height="22" rx="11" fill="#c8651b"/>
  <text x="260" y="91" text-anchor="middle" font-weight="700" fill="#fff" class="n" font-size="12.5">Jeton d'identité</text>
  <text x="260" y="122" text-anchor="middle" fill="#5c6b73" font-size="12">lu par l'application pour ouvrir la session</text>
  <line x1="400" y1="180" x2="674" y2="180" stroke="#17252e" stroke-width="1.6" marker-end="url(#f)"/>
  <rect x="478.0" y="155" width="124" height="22" rx="11" fill="#0f5964"/>
  <text x="540" y="171" text-anchor="middle" font-weight="700" fill="#fff" class="n" font-size="12.5">Jeton d'accès</text>
  <text x="540" y="202" text-anchor="middle" fill="#5c6b73" font-size="12">présenté à l'API à chaque appel</text>
  <text x="540" y="218" text-anchor="middle" fill="#5c6b73" font-size="12">l'application ne le lit pas</text>
  <line x1="400" y1="266" x2="126" y2="266" stroke="#17252e" stroke-width="1.6" marker-end="url(#f)"/>
  <rect x="165.0" y="241" width="190" height="22" rx="11" fill="#5c6b73"/>
  <text x="260" y="257" text-anchor="middle" font-weight="700" fill="#fff" class="n" font-size="12.5">Jeton de rafraîchissement</text>
  <text x="260" y="288" text-anchor="middle" fill="#5c6b73" font-size="12">rendu au fournisseur contre un nouveau jeton d'accès</text>
  <line x1="400" y1="330" x2="674" y2="330" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#fr)"/>
  <g stroke="#b3261e" stroke-width="3" stroke-linecap="round"><line x1="530" y1="320" x2="550" y2="340"/><line x1="550" y1="320" x2="530" y2="340"/></g>
  <text x="540" y="360" text-anchor="middle" font-weight="700" fill="#b3261e" font-size="12.5">jamais le jeton d'identité vers une API</text>
  <text x="400" y="392" text-anchor="middle" fill="#5c6b73" font-size="12.5">Chaque jeton a un seul destinataire : ne les confondez jamais.</text>
</svg>
